version: "3.9"
services:

  # MongoDB service
  mongo_db:
    image: mongo
    command: mongod --auth
    ports:
      - "3117:27017"
    volumes:
      - mongo-db:/data/db
    restart: always
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_INITDB_ROOT_USERNAME:-root}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_INITDB_ROOT_PASSWORD:-engage}
      - MONGO_INITDB_DATABASE=engageBot

    # Redis       
    redis:
      image: redis
      ports:
        - "3118:6379"
      restart: always
      command: redis-server --requirepass ${REDIS_PASSWORD:-engage}

  # Backend service
  backend:
    depends_on:
      - mongo_db
    image: beyondfuture/engage-backend:v1

    volumes:
      - ./logs/backend:/app/logs
      - ./chatbot-backend/uploaded-docs:/app/uploaded-docs

    ports:
      - "4000:4000"

    environment:
      PORT: 4000
      DATABASE_HOST: mongo_db
      DATABASE_PORT: 27017
      DATABASE_NAME: engageBot
      DATABASE_USER: ${MONGO_INITDB_ROOT_USERNAME:-root}
      DATABASE_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-engage}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-engage}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}

  # Frontend Services

  frontend:

    depends_on:
      - backend
    build:
      args:
        - API_URL=http://localhost:4000
    image: beyondfuture/engage-frontend:v1

    ports:
      - "3000:3000"
    environment:
      PORT: 3000

  # Plugin

  plugin:
    image: beyondfuture/engage-plugin:v1
    volumes:
      - ./chatbot-backend/uploaded-docs/plugin.js:/app/plugin.js
  # Nginx configuration for reverse proxy 
  nginx:
    depends_on:
      - backend
      - frontend
    image: nginx:latest

    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./nginx/certs:/etc/nginx/certs
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/mime.types:/etc/nginx/mime.types
      - ./nginx/proxy.conf:/etc/nginx/proxy.conf
      - ./logs/nginx:/var/log/nginx
    restart: always

volumes:
  mongo-db: {}
