    <script type="application/ld+json">
      {
            "@context": "https://schema.org",
            "@type": "FAQPage",
            "mainEntity": [
                  {
                        "@type": "Question",
                        "name": "What does JarCube actually do?",
                        "acceptedAnswer": {
                              "@type": "Answer",
                              "text": "JarCube sits on top of your WhatsApp Business number and gives you one dashboard for it. Your team answers chats from a shared inbox, an AI assistant handles the routine questions on its own, automated flows carry customers through booking or ordering, and broadcast campaigns go out to segments you choose."
                        }
                  },
                  {
                        "@type": "Question",
                        "name": "Can I keep the WhatsApp number I already use?",
                        "acceptedAnswer": {
                              "@type": "Answer",
                              "text": "Usually yes. An existing number can be migrated to the WhatsApp Business API, or we can set you up with a new one. There are a few constraints depending on how the number is currently registered, and we will walk through them with you during onboarding."
                        }
                  },
                  {
                        "@type": "Question",
                        "name": "Do I need a developer to set this up?",
                        "acceptedAnswer": {
                              "@type": "Answer",
                              "text": "No. The flow builder works by dragging blocks into place, campaigns and the knowledge base are managed from the dashboard, and none of it requires code. If you do want to wire JarCube into your own systems, the API and webhooks are there for your developers."
                        }
                  },
                  {
                        "@type": "Question",
                        "name": "How many people from my team can use it?",
                        "acceptedAnswer": {
                              "@type": "Answer",
                              "text": "That depends on your plan — Starter includes 2 agent seats, Growth 5, Business 15, and Enterprise is unlimited. On every plan you can group agents into departments, set what each role can see, and route incoming chats to the right person."
                        }
                  },
                  {
                        "@type": "Question",
                        "name": "Will it connect to my CRM or online store?",
                        "acceptedAnswer": {
                              "@type": "Answer",
                              "text": "Yes. There are direct integrations for common CRMs, Google Sheets and Shopify, with Salesforce and HubSpot on Business and above. Anything else can be connected through our API, webhooks, or a connector platform such as Zapier."
                        }
                  },
                  {
                        "@type": "Question",
                        "name": "How do WhatsApp message charges work?",
                        "acceptedAnswer": {
                              "@type": "Answer",
                              "text": "Meta charges per message at its own published rates, and those charges are billed to you separately. Your JarCube subscription covers the platform itself — the inbox, automation, AI and team features. We do not add a markup on top of what Meta charges."
                        }
                  },
                  {
                        "@type": "Question",
                        "name": "What support do I get?",
                        "acceptedAnswer": {
                              "@type": "Answer",
                              "text": "Every plan includes support during business hours, and we help you through initial setup so you are not staring at an empty dashboard. Growth and above move you to priority support, and Business adds hands-on onboarding assistance."
                        }
                  },
                  {
                        "@type": "Question",
                        "name": "Is there a free trial?",
                        "acceptedAnswer": {
                              "@type": "Answer",
                              "text": "Growth comes with a 14-day free trial so you can build a flow, connect a number and see how it handles real conversations before committing. If you would rather be walked through it, book a demo and we will show you the parts relevant to your business."
                        }
                  }
            ]
      }
