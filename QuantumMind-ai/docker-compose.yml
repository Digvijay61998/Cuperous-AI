name: quantummind-ai

# ---------------------------------------------------------------------------
# Storage backend switch (local MinIO vs production AWS S3)
# ---------------------------------------------------------------------------
# Milvus stores its vector segments in an S3-compatible object store. Which one
# it talks to is decided by two env vars, both driven from the single flag
# ENABLE_MILVUS_S3 in .env (the Makefile keeps them in sync for you):
#
#   ENABLE_MILVUS_S3=false  (local dev, DEFAULT)
#       COMPOSE_PROFILES=localstorage   -> starts the local `minio` container
#       MILVUS_USER_CONFIG=user.local.yaml -> Milvus points at minio:9000
#
#   ENABLE_MILVUS_S3=true   (production)
#       COMPOSE_PROFILES=(empty)        -> no local minio container
#       MILVUS_USER_CONFIG=user.yaml    -> Milvus points at AWS S3
#
# See docs/STORAGE.md for the full explanation.
services:
  etcd:
    container_name: milvus-etcd
    image: quay.io/coreos/etcd:v3.5.14
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - etcd_data:/etcd
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3

  # Local S3-compatible object store. Only runs when the "localstorage" compose
  # profile is active (ENABLE_MILVUS_S3=false). In production (S3) this service
  # is not started, and Milvus talks to AWS S3 directly.
  minio:
    container_name: milvus-minio
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    profiles: ["localstorage"]
    environment:
      # Reuses the same credential env vars as the S3 path so there is a single
      # place to look. For purely local data these values are arbitrary.
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY:-minioadmin}
    command: minio server /minio_data --console-address ":9001"
    volumes:
      - minio_data:/minio_data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  milvus:
    container_name: milvus-standalone
    image: milvusdb/milvus:v2.4.15
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      # The only two minio settings Milvus reads from the environment. Bucket,
      # region, address and SSL live in the mounted user config — see the
      # user*.yaml files for why.
      MINIO_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      MINIO_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
    volumes:
      # Which override is mounted decides the storage backend. Defaults to the
      # local MinIO config; set MILVUS_USER_CONFIG=user.yaml for AWS S3.
      # Mounted as a separate file, never replacing milvus.yaml — overwriting
      # that 1030-line default with a partial config makes Milvus abort on boot.
      - ./milvus/${MILVUS_USER_CONFIG:-user.yaml}:/milvus/configs/user.yaml:ro
      # Local scratch only (WAL, query cache). Bulk data lives in the object store.
      - milvus_cache:/var/lib/milvus
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_period: 120s
      timeout: 20s
      retries: 5
    ports:
      - "19530:19530"
      - "9091:9091"
    depends_on:
      - etcd

  ai-service:
    container_name: quantummind-ai
    build: .
    env_file:
      - .env
    environment:
      MILVUS_HOST: milvus
      MILVUS_PORT: "19530"
    ports:
      - "8000:8000"
    depends_on:
      milvus:
        condition: service_healthy
    restart: unless-stopped

volumes:
  etcd_data:
  minio_data:
  milvus_cache:

networks:
  default:
    name: quantummind-ai
