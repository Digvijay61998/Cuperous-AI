name: quantummind-ai

services:
  etcd:
    container_name: milvus-etcd
    image: quay.io/coreos/etcd:v3.5.14
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - etcd_data:/etcd
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3

  milvus:
    container_name: milvus-standalone
    image: milvusdb/milvus:v2.4.15
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      # The only two minio settings Milvus reads from the environment. Bucket,
      # region and SSL live in milvus/user.yaml — see that file for why.
      MINIO_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      MINIO_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
    volumes:
      # Override file merged over the image's default milvus.yaml. Mounted as a
      # separate file, never replacing milvus.yaml — overwriting that 1030-line
      # default with a partial config makes Milvus abort on startup.
      - ./milvus/user.yaml:/milvus/configs/user.yaml:ro
      # Local scratch only (WAL, query cache). Bulk data lives in S3.
      - milvus_cache:/var/lib/milvus
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_period: 120s
      timeout: 20s
      retries: 5
    ports:
      - "19530:19530"
      - "9091:9091"
    depends_on:
      - etcd

  ai-service:
    container_name: quantummind-ai
    build: .
    env_file:
      - .env
    environment:
      MILVUS_HOST: milvus
      MILVUS_PORT: "19530"
    ports:
      - "8000:8000"
    depends_on:
      milvus:
        condition: service_healthy
    restart: unless-stopped

volumes:
  etcd_data:
  milvus_cache:

networks:
  default:
    name: quantummind-ai
