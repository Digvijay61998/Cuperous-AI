<!doctype html>
<!--
  JarCube · 30-second live-action brand film · edit master / animatic.

  What this page is:
    - The locked 30.0 s edit timeline (16 shots, 24 fps) for the brand film.
    - Live-action shots are footage slots. Drop footage/<SHOT>.webm (or .mp4) in
      ./footage and it plays in place of the slate. Until then a slate shows the
      shot brief, so the full film can be reviewed for timing today.
    - Product screens (phone notifications, WhatsApp conversation, booking
      WebView, booking website) are built here as clean, readable inserts so no
      AI-generated interface text ever reaches the final film. Labels mirror the
      real salon-booking-template (QuantumMind-templates).
    - End card uses the real JarCube logo (assets/jarcube-logo.png).

  Preview: open in Chrome, press Space to play/pause, Left/Right to step 1 frame.
  Insert-only plates for screen replacement: brand-film.html?insert=1B (or 3B, 4B, 7B).
  Render:  node ../record.mjs --page "brand-film/brand-film.html" --fps 24 --to 30 --scale 2 --out brand-film/JarCube-Brand-Film-30s.mp4
  Deterministic timeline: window.seek(t) (returns a Promise once video frames are ready).
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>JarCube · Brand film 30s</title>

<script>
const FPS = 24, DURATION = 30;
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const ease = (x) => { x = clamp(x); return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
const ramp = (t, a, b) => ease((t - a) / (b - a));           // 0→1 between a and b
const tc = (s) => { const f = Math.round(s * FPS); const p = (n) => String(n).padStart(2, '0');
  return `00:00:${p(Math.floor(f / FPS))}:${p(f % FPS)}`; };

/* ======================================================================
   Edit decision list. start/end in seconds. xf = dissolve-in length.
   type live  → footage slot (footage/<id>.webm|.mp4) with brief slate
   type ui    → built product insert (accurate text)
   type end   → brand end card
   ====================================================================== */
const SHOTS = [

  { id:'2A', start:4.50,  end:6.25,  type:'live', scene:'2 · Discovering JarCube', xf:0.33,
    title:'JarCube specialist opens the laptop at the salon lounge table',
    brief:'Over-shoulder. Rohan (JarCube specialist, navy polo) turns the laptop toward Ananya. Screen = REAL screen recording of the JarCube dashboard: Bots → flow builder showing the salon booking journey. Composite in post.' },
  { id:'2B', start:6.25,  end:8.00,  type:'live', scene:'2 · Discovering JarCube',
    title:'Owner leans in as the workflow makes sense',
    brief:'CU on Ananya. She leans toward the screen, a small nod, a half smile. Rohan points to one step on screen. Natural dialogue (optional, under VO): "So it answers the price and sends them the booking link?" "Exactly."' },
  { id:'3A', start:8.00,  end:9.00,  type:'live', scene:'3 · WhatsApp AI in action',
    title:'Customer messages the salon from home',
    brief:'Priya on a sofa in a bright Bengaluru apartment, evening window light. She types on her phone, screen facing her (not camera).' },
  { id:'3B', start:9.00,  end:14.00, type:'ui', scene:'3 · WhatsApp AI in action', render:renderChat,
    title:'Insert: WhatsApp enquiry → AI answer → booking flow → confirmation' },

  { id:'4A', start:15.00, end:16.25, type:'live', scene:'4 · The custom website',
    title:'Customer opens the salon website on her laptop',
    brief:'Same apartment, dining table, same wardrobe. Priya opens the Aura Salon website on a laptop to book a manicure for next week. Screen faces away or is replaced in post.' },

    brief:'Morning, salon reception. Ananya with coffee, scrolling the JarCube shared inbox on the reception laptop. Screen = REAL recording of the inbox with the demo conversations from 3B/4B. Composite in post.' },

// Centre of `target` in the unscaled coordinate space of `frame` (ignores the camera push transform).
function centreIn(frame, target, baseWidth) {
  const fr = frame.getBoundingClientRect(), r = target.getBoundingClientRect();
  const k = fr.width / baseWidth;
  return [(r.left + r.width / 2 - fr.left) / k, (r.top + r.height / 2 - fr.top) / k];
}
// Tap helper: show a touch ripple on `target` around time `at`.
function tapAt(tapEl, lt, at, target) {
  const d = lt - at;
  if (d < -0.12 || d > 0.3) return false;
  const screen = tapEl.parentElement;
  const [x, y] = centreIn(screen, target, screen.offsetWidth);
  tapEl.style.left = x + 'px'; tapEl.style.top = y + 'px';
  tapEl.style.opacity = d < 0 ? 0.9 : 0.9 * (1 - d / 0.3);
  tapEl.style.transform = `scale(${d < 0 ? 0.8 : 0.8 + d * 1.6})`;
  return true;
}

}

// ?insert=3B → render only that insert, full frame, on its own timeline (clean plate for screen replacement).
const params = new URLSearchParams(location.search);
const INSERT = params.get('insert');

function seekVideo(v, time) {
  return new Promise((resolve) => {
    const target = clamp(time, 0, Math.max(0, (v.duration || 0) - 0.001));
    if (Math.abs(v.currentTime - target) < 0.0005) { resolve(); return; }
    const done = () => { v.removeEventListener('seeked', done); resolve(); };
    v.addEventListener('seeked', done);
    v.currentTime = target;
    setTimeout(done, 1500);
  });
}

window.seek = async function seek(t) {
  await Promise.all(SHOTS.filter((s) => s.ready).map((s) => s.ready));
  const pending = [];
  for (const s of SHOTS) {
    let op = 0, lt = t - s.start;
    if (INSERT) {
      op = s.id === INSERT ? 1 : 0; lt = t;
    } else {
      const xf = s.xf || 0;
      if (t >= s.start - xf && t < s.end) op = xf && t < s.start ? ease((t - (s.start - xf)) / xf) : 1;
      if (s.id === '7B' && t >= s.end) op = 1;  // hold last frame
    }
    s.el.style.opacity = op;
    s.el.style.zIndex = SHOTS.indexOf(s);
    if (!op) continue;
    if (s.render) s.render(s.el, Math.max(0, lt));
    if (s.video) pending.push(seekVideo(s.video, Math.max(0, lt)));
  }
  SUPERS.forEach((sp, i) => {
    const o = INSERT ? 0 : ramp(t, sp.start, sp.start + 0.35) * (1 - ramp(t, sp.end - 0.3, sp.end));
    superEls[i].style.opacity = o;
    superEls[i].style.transform = `translateX(${(1 - o) * -16}px)`;
  });
  document.getElementById('hud').textContent =
    `${tc(t)}  ${INSERT ? 'insert ' + INSERT : (SHOTS.find((s) => t >= s.start && t < s.end) || SHOTS[SHOTS.length - 1]).id}`;
  await Promise.all(pending);
};

/* ---------------------------------------------------------------- preview controls */
let cur = 0, playing = false, last = 0;
const loop = async (now) => {
  if (!playing) return;
  cur += (now - last) / 1000; last = now;
  if (cur >= DURATION) { cur = DURATION; playing = false; }
  await window.seek(cur);
  requestAnimationFrame(loop);
};
window.addEventListener('keydown', (e) => {
  document.body.classList.add('preview');
  if (e.code === 'Space') { e.preventDefault(); playing = !playing; if (cur >= DURATION) cur = 0; last = performance.now(); requestAnimationFrame(loop); }
  if (e.code === 'ArrowRight') { cur = Math.min(DURATION, cur + 1 / FPS); window.seek(cur); }
  if (e.code === 'ArrowLeft') { cur = Math.max(0, cur - 1 / FPS); window.seek(cur); }
  if (e.code === 'Home') { cur = 0; window.seek(0); }
});
window.seek(Number(params.get('t') || 0));
